"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_grey2)\
$os\
$username\
[](bg:color_bg_statusline3 fg:color_grey2)\
$directory\
[](fg:color_bg_statusline3 bg:color_bg1)\
$git_branch\
$git_status\
$git_state\
$git_metrics\
[](fg:color_bg1 bg:color_bg_statusline3)\
$c\
$lua\
$cmake\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_bg_statusline3 bg:color_grey2)\
$cmd_duration\
[](fg:color_grey2) \
\n$character"""

add_newline = true

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg1 = '#DDC7A1'
color_bg0 = '#32302F'
color_bg1 = '#3C3836'
color_bg3 = '#665C54'
color_bg_statusline3 = '#5B534D'
color_blue = '#7DAEA3'
color_aqua = '#7DAEA3'
color_green = '#A9B665'
color_orange = '#E78A4E'
color_purple = '#D3869B'
color_red = '#EA6962'
color_yellow = '#D8A657'
color_grey2 = '#A89984'

[palettes.nord]
color_fg1 = '#e5e9f0'
color_bg0 = '#2e3440'
color_bg1 = '#3b4252'
color_bg3 = '#434c5e'
color_bg_statusline3 = '#4c566a'
color_blue = '#81a1c1'
color_aqua = '#8fbcbb'
color_green = '#a3be8c'
color_orange = '#d08770'
color_purple = '#b48ead'
color_red = '#bf616a'
color_yellow = '#ebcb8b'
color_grey2 = '#d8dee9'

[palettes.british_country_style]
color_fg1 = '#bdc4bb'
color_bg0 = '#2f322f'
color_bg1 = '#353b35'
color_bg3 = '#454f45'
color_bg_statusline3 = '#4f5b4d'
color_blue = '#839cb4'
color_aqua = '#8daaa8'
color_green = '#83b48b'
color_orange = '#e6a665'
color_purple = '#ad9097'
color_red = '#be625d'
color_yellow = '#ddc16e'
color_grey2 = '#969e94'

[os]
disabled = false
style = "bg:color_grey2 fg:color_bg1"

[os.symbols]
Windows = " 󰍲"
Ubuntu = " 󰕈"
SUSE = " "
openSUSE = " "
Raspbian = " 󰐿"
Mint = " 󰣭"
Macos = " 󰀵"
Manjaro = " "
Linux = " 󰌽"
Gentoo = " 󰣨"
Fedora = " 󰣛"
Alpine = " "
Amazon = " "
Android = " "
Arch = " 󰣇"
Artix = " 󰣇"
CentOS = " "
Debian = " 󰣚"
Redhat = " 󱄛"
RedHatEnterprise = " 󱄛"

[username]
show_always = true
style_user = "bg:color_grey2 fg:color_bg0"
style_root = "bg:color_grey2 fg:color_bg0"
format = '[ $user ]($style)'

[directory]
style = "fg:color_green bg:color_bg_statusline3"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
use_os_path_sep = false

[git_branch]
symbol = ""
style = "bg:color_bg1"
format = '[[ $symbol $branch ](fg:color_blue bg:color_bg1)]($style)'

[git_status]
style = "bg:color_bg1"
format = '[[($all_status$ahead_behind )](fg:color_orange bg:color_bg1)]($style)'

[git_state]
style = "fg:color_purple bg:color_bg1"
format = '[\($state( $progress_current/$progress_total)\) ]($style)'

[git_metrics]
disabled = false
added_style = "fg:color_green bg:color_bg1"
deleted_style = "fg:color_red bg:color_bg1"
format = '[([ $added ]($added_style))([ $deleted ]($deleted_style))](bg:color_bg1)'

[nodejs]
symbol = ""
style = "bg:color_bg_statusline3"
format = '[[ $symbol ](fg:color_fg1 bg:color_bg_statusline3)]($style)'

[c]
symbol = " "
style = "bg:color_bg_statusline3"
detect_extensions=['c','h','cpp','hpp']
format = '[[ $symbol ](fg:color_fg1 bg:color_bg_statusline3)]($style)'

[cmake]
symbol = "󰔷"
style = "bg:color_bg_statusline3"
format = '[[ $symbol ](fg:color_fg1 bg:color_bg_statusline3)]($style)'

[lua]
symbol = ""
style = "bg:color_bg_statusline3"
format = '[[ $symbol ](fg:color_fg1 bg:color_bg_statusline3)]($style)'

[rust]
symbol = ""
style = "bg:color_bg_statusline3"
format = '[[ $symbol ](fg:color_fg1 bg:color_bg_statusline3)]($style)'

[golang]
symbol = ""
style = "bg:color_bg_statusline3"
format = '[[ $symbol ](fg:color_fg1 bg:color_bg_statusline3)]($style)'

[php]
symbol = ""
style = "bg:color_bg_statusline3"
format = '[[ $symbol ](fg:color_fg1 bg:color_bg_statusline3)]($style)'

[java]
symbol = " "
style = "bg:color_bg_statusline3"
format = '[[ $symbol ](fg:color_fg1 bg:color_bg_statusline3)]($style)'

[kotlin]
symbol = ""
style = "bg:color_bg_statusline3"
format = '[[ $symbol ](fg:color_fg1 bg:color_bg_statusline3)]($style)'

[haskell]
symbol = ""
style = "bg:color_bg_statusline3"
format = '[[ $symbol ](fg:color_fg1 bg:color_bg_statusline3)]($style)'

[python]
symbol = ""
style = "bg:color_bg_statusline3"
format = '[[ $symbol ](fg:color_fg1 bg:color_bg_statusline3)]($style)'

[docker_context]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:#83a598 bg:color_bg3)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg1 bg:color_bg1)]($style)'

[cmd_duration]
disabled = false
min_time = 0
show_milliseconds = false
style = "bg:color_grey2"
format = '[[  $duration ](fg:color_bg0 bg:color_grey2)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[I❯](bold fg:color_green)'
error_symbol = '[I❯](bold fg:color_red)'
vimcmd_symbol = '[N❯](bold fg:color_grey2)'
vimcmd_replace_one_symbol = '[R❯](bold fg:color_yellow)'
vimcmd_replace_symbol = '[R❯](bold fg:color_yellow)'
vimcmd_visual_symbol = '[V❯](bold fg:color_purple)'
